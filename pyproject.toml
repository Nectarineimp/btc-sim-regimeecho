[tool.poetry]
name = "btc-sim-regimeecho"
version = "0.1.0"
description = "Filtered Empirical Block Bootstrap (Non-Parametric Era 4 Echo) for Bitcoin Simulation"
authors = ["Peter Mancini <krahang@pm.me>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^1.26"
pandas = "^2.2"
scipy = "^1.13"
matplotlib = "^3.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"